packages:
  - "packages/*"
  - "apps/*"

# O pnpm 10+ não roda script de install de dependência sem autorização explícita.
# O Prisma precisa dos três: `@prisma/engines` baixa os engines binários, `prisma` e
# `@prisma/client` preparam o client. Sem isto, `prisma generate` falha por engine ausente.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  unrs-resolver: true
